<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>云端同步限时抽奖系统</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 550px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        
        textarea, input[type="number"], input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        
        /* 勾选人员区域样式 */
        .person-list { max-height: 180px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 4px; background: #fafafa; }
        .person-item { display: inline-block; width: 45%; margin-bottom: 8px; cursor: pointer; }
        .person-item input { width: auto; margin-right: 5px; cursor: pointer; }
        
        .action-btns { margin: 8px 0; }
        .action-btns button, .update-btn { width: auto; padding: 6px 12px; font-size: 13px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .action-btns button:hover, .update-btn:hover { background: #0056b3; }
        
        .draw-btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .draw-btn:hover { background: #218838; }
        .draw-btn:disabled { background: #6c757d; cursor: not-allowed; }
        
        #timer { font-weight: bold; color: #dc3545; margin-top: 10px; text-align: center; }
        #result { margin-top: 20px; padding: 12px; background: #e9f7ef; border-left: 5px solid #28a745; border-radius: 4px; }
        #syncStatus { font-size: 12px; color: #6c757d; margin-top: 4px; }

        /* 24小时抽奖历史记录样式 */
        .history-box { margin-top: 25px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fcfcfc; }
        .history-item { padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .history-item:last-child { border-bottom: none; }
        .history-time { font-size: 12px; color: #888; font-weight: bold; }
    </style>
</head>
<body>

    <h2>云端同步限时抽奖系统</h2>

    <!-- 1. 录入固定名单 -->
    <div class="input-group">
        <label for="customList">1. 设置/修改固定总名单（每行一个名字）：</label>
        <textarea id="customList" rows="6" placeholder="在此粘贴或输入名字..."></textarea>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
            <span id="syncStatus">正在加载云端名单...</span>
            <button class="update-btn" id="saveBtn" onclick="saveToCloud()">保存并同步到所有设备</button>
        </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <!-- 2. 选择参抽人员 -->
    <div class="input-group">
        <label>2. 选择本次参加抽奖的人员：</label>
        <div class="action-btns">
            <button onclick="selectAll(true)">全选</button>
            <button onclick="selectAll(false)">全不选</button>
        </div>
        <div class="person-list" id="personContainer">
            <span style="color:#888;">数据同步中...</span>
        </div>
    </div>

    <!-- 3. 中奖名额 -->
    <div class="input-group">
        <label for="winnerCount">3. 中奖名额：</label>
        <input type="number" id="winnerCount" min="1" value="1">
    </div>

    <!-- 抽奖按钮与状态提示 -->
    <button class="draw-btn" id="drawBtn" onclick="drawWinners()">开始抽奖</button>
    <div id="timer"></div>
    <div id="result"></div>

    <!-- 24小时中奖记录区域 -->
    <div class="history-box">
        <label>📜 24小时内抽奖历史记录：</label>
        <div id="historyList">
            <span style="color:#888; font-size: 13px;">暂无 24 小时内的抽奖记录</span>
        </div>
    </div>

    <script>
        // ================= 【请把下面两个替换为您在 JSONBin 获取的值】 =================
        const BIN_ID = "6a7cf24dda38895dfedcb6bd";             // 例如: "66e01234abc123456789"
        const MASTER_KEY = "$2a$10$HI66QgowV7lxqL6KIAHHKeikbGO1ra8OgiFxkb6sfly.Z8gAhEtL6

YOUR_MASTER_K";     // 例如: "$2a$10$abcdefghijklmnopqrstuvwxyz"
        // ===========================================================================

        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // 从云端加载名单
        async function loadFromCloud() {
            const statusDiv = document.getElementById('syncStatus');
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await response.json();
                const listText = data.record.list || '';
                
                document.getElementById('customList').value = listText;
                renderCheckboxes(listText);
                statusDiv.innerText = "✅ 云端数据加载完成";
                statusDiv.style.color = "#28a745";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "❌ 加载失败，请检查网络或密钥设置";
                statusDiv.style.color = "#dc3545";
            }
        }

        // 保存名单到云端
        async function saveToCloud() {
            const rawText = document.getElementById('customList').value.trim();
            const statusDiv = document.getElementById('syncStatus');
            const saveBtn = document.getElementById('saveBtn');

            if (!rawText) {
                alert('请先输入名单！');
                return;
            }

            saveBtn.disabled = true;
            statusDiv.innerText = "正在同步到云端...";
            statusDiv.style.color = "#007bff";

            try {
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ list: rawText })
                });

                if (response.ok) {
                    renderCheckboxes(rawText);
                    statusDiv.innerText = "✅ 保存成功！已同步至所有设备";
                    statusDiv.style.color = "#28a745";
                    alert('名单已成功同步至所有设备！');
                } else {
                    throw new Error('网络响应异常');
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "❌ 保存失败，请重试";
                statusDiv.style.color = "#dc3545";
                alert('保存失败，请检查配置！');
            } finally {
                saveBtn.disabled = false;
            }
        }

        // 渲染勾选框列表
        function renderCheckboxes(rawText) {
            const members = rawText.split('\n').map(name => name.trim()).filter(name => name !== '');
            const container = document.getElementById('personContainer');
            container.innerHTML = '';

            if (members.length === 0) {
                container.innerHTML = '<span style="color:#888;">没有有效的名单输入</span>';
                return;
            }

            members.forEach(name => {
                const itemDiv = document.createElement('label');
                itemDiv.className = 'person-item';
                itemDiv.innerHTML = `<input type="checkbox" class="member-checkbox" value="${name}" checked> ${name}`;
                container.appendChild(itemDiv);
            });
        }

        // 全选 / 全不选
        function selectAll(status) {
            const checkboxes = document.querySelectorAll('.member-checkbox');
            checkboxes.forEach(cb => cb.checked = status);
        }

        // 获取半小时窗口标识 (例: 2026-8-13-14-0)
        function getCurrentSlotId() {
            const now = new Date();
            const slot = now.getMinutes() < 30 ? 0 : 1;
            return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}-${now.getHours()}-${slot}`;
        }

        // 倒计时计算
        function getSecondsUntilNextSlot() {
            const now = new Date();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const targetMinutes = minutes < 30 ? 30 : 60;
            return (targetMinutes - minutes) * 60 - seconds;
        }

        // 检查半小时限制状态
        function checkStatus() {
            const currentSlot = getCurrentSlotId();
            const lastDrawnSlot = localStorage.getItem('lastDrawnSlot');
            const btn = document.getElementById('drawBtn');
            const timerDiv = document.getElementById('timer');

            if (lastDrawnSlot === currentSlot) {
                btn.disabled = true;
                const remainingSeconds = getSecondsUntilNextSlot();
                const m = Math.floor(remainingSeconds / 60);
                const s = remainingSeconds % 60;
                timerDiv.innerHTML = `⚠️ 本半小时已抽奖，下次开放还剩：${m} 分 ${s < 10 ? '0' : ''}${s} 秒`;
            } else {
                btn.disabled = false;
                timerDiv.innerHTML = "✅ 当前半小时窗口开放中，可以抽奖";
            }

            // 定时刷新并清理过期的 24 小时历史记录
            renderHistory();
        }

        // 保存新的抽奖日志并自动过滤超过24小时的旧日志
        function addHistoryRecord(winners) {
            let history = JSON.parse(localStorage.getItem('lotteryHistory24h') || '[]');
            const nowTimestamp = Date.now();
            const timeString = new Date().toLocaleString('zh-CN', { hour12: false });

            // 增加新记录
            history.unshift({
                timestamp: nowTimestamp,
                timeStr: timeString,
                winners: winners
            });

            // 过滤掉超过24小时（24 * 60 * 60 * 1000 毫秒）的记录
            const twentyFourHoursMs = 24 * 60 * 60 * 1000;
            history = history.filter(item => (nowTimestamp - item.timestamp) < twentyFourHoursMs);

            localStorage.setItem('lotteryHistory24h', JSON.stringify(history));
            renderHistory();
        }

        // 渲染 24 小时历史记录列表
        function renderHistory() {
            const historyListDiv = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('lotteryHistory24h') || '[]');
            const nowTimestamp = Date.now();
            const twentyFourHoursMs = 24 * 60 * 60 * 1000;

            // 清理超过24小时的过期记录
            history = history.filter(item => (nowTimestamp - item.timestamp) < twentyFourHoursMs);
            localStorage.setItem('lotteryHistory24h', JSON.stringify(history));

            if (history.length === 0) {
                historyListDiv.innerHTML = '<span style="color:#888; font-size: 13px;">暂无 24 小时内的抽奖记录</span>';
                return;
            }

            historyListDiv.innerHTML = history.map((item, idx) => `
                <div class="history-item">
                    <div class="history-time">⏱️ 抽奖时间：${item.timeStr}</div>
                    <div>🎉 中奖名单：<strong>${item.winners.join('、')}</strong></div>
                </div>
            `).join('');
        }

        // 核心抽奖逻辑
        function drawWinners() {
            const checkboxes = document.querySelectorAll('.member-checkbox:checked');
            let participants = Array.from(checkboxes).map(cb => cb.value);

            const count = parseInt(document.getElementById('winnerCount').value, 10);
            const resultDiv = document.getElementById('result');

            if (participants.length === 0) {
                alert('请至少勾选一位参抽人员！');
                return;
            }

            if (isNaN(count) || count < 1) {
                alert('请输入有效的中奖名额！');
                return;
            }

            if (count > participants.length) {
                alert(`中奖名额 (${count}) 不能大于所选人数 (${participants.length})！`);
                return;
            }

            // 洗牌算法
            for (let i = participants.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [participants[i], participants[j]] = [participants[j], participants[i]];
            }

            const winners = participants.slice(0, count);

            // 显示中奖结果
            resultDiv.innerHTML = `<strong>🎉 本轮中奖名单（共 ${count} 人）：</strong><br><br>` + 
                winners.map((w, index) => `<b>第 ${index + 1} 名：</b> ${w}`).join('<br>');

            // 1. 记录抽奖时间和中奖名单（保存并自动过滤24小时内的记录）
            addHistoryRecord(winners);

            // 2. 记录已抽奖并锁定半小时
            localStorage.setItem('lastDrawnSlot', getCurrentSlotId());
            checkStatus();
        }

        // 页面启动运行
        loadFromCloud();
        setInterval(checkStatus, 1000);
        checkStatus();
    </script>

</body>
</html>
