<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>云端同步限时抽奖系统</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        
        textarea, input[type="number"], input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        
        /* 勾选人员区域样式：一排5个，无滚动条 */
        .person-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; border: 1px solid #ddd; padding: 12px; border-radius: 4px; background: #fafafa; }
        .person-item { display: flex; align-items: center; cursor: pointer; font-size: 14px; word-break: break-all; }
        .person-item input { width: auto; margin-right: 6px; cursor: pointer; }
        
        .action-btns { margin: 8px 0; }
        .action-btns button, .update-btn { width: auto; padding: 6px 12px; font-size: 13px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .action-btns button:hover, .update-btn:hover { background: #0056b3; }
        
        .draw-btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .draw-btn:hover { background: #218838; }
        .draw-btn:disabled { background: #6c757d; cursor: not-allowed; }
        
        #timer { font-weight: bold; color: #dc3545; margin-top: 10px; text-align: center; }
        #result { margin-top: 20px; padding: 12px; background: #e9f7ef; border-left: 5px solid #28a745; border-radius: 4px; }
        #syncStatus { font-size: 12px; color: #6c757d; margin-top: 4px; }

        /* 24小时抽奖历史记录样式 */
        .history-box { margin-top: 25px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fcfcfc; }
        .history-item { padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 14px; line-height: 1.6; }
        .history-item:last-child { border-bottom: none; }
        .history-time { font-size: 12px; color: #666; font-weight: bold; margin-bottom: 4px; }
        .history-detail { font-size: 13px; color: #333; }
    </style>
</head>
<body>

    <h2>云端同步限时抽奖系统</h2>

    <!-- 1. 录入固定名单 -->
    <div class="input-group">
        <label for="customList">1. 设置/修改固定总名单（每行一个名字）：</label>
        <textarea id="customList" rows="6" placeholder="在此粘贴或输入名字..."></textarea>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
            <span id="syncStatus">正在同步云端数据...</span>
            <button class="update-btn" id="saveBtn" onclick="saveToCloud()">保存并同步到所有设备</button>
        </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <!-- 2. 选择参抽人员 -->
    <div class="input-group">
        <label>2. 选择本次参加抽奖的人员：</label>
        <div class="action-btns">
            <button onclick="selectAll(true)">全选</button>
            <button onclick="selectAll(false)">全不选</button>
        </div>
        <div class="person-list" id="personContainer">
            <span style="color:#888; grid-column: span 5;">加载中...</span>
        </div>
    </div>

    <!-- 3. 抽奖主题 -->
    <div class="input-group">
        <label for="lotteryTitle">3. 抽奖主题：</label>
        <input type="text" id="lotteryTitle" value="幸运大抽奖" placeholder="请输入本次抽奖的主题">
    </div>

    <!-- 4. 中奖名额 -->
    <div class="input-group">
        <label for="winnerCount">4. 中奖名额：</label>
        <input type="number" id="winnerCount" min="1" value="1">
    </div>

    <!-- 抽奖按钮与状态提示 -->
    <button class="draw-btn" id="drawBtn" onclick="drawWinners()">开始抽奖</button>
    <div id="timer"></div>
    <div id="result"></div>

    <!-- 24小时中奖记录区域 -->
    <div class="history-box">
        <label>📜 24小时内抽奖历史记录（全端同步）：</label>
        <div id="historyList">
            <span style="color:#888; font-size: 13px;">加载云端历史记录中...</span>
        </div>
    </div>

    <script>
        // ================= 【请把下面两个替换为您在 JSONBin 获取的值】 =================
        const BIN_ID = "6a7cf24dda38895dfedcb6bd";             // 例如: "66e01234abc123456789"
        const MASTER_KEY = "$2a$10$HI66QgowV7lxqL6KIAHHKeikbGO1ra8OgiFxkb6sfly.Z8gAhEtL6";     // 例如: "$2a$10$abcdefghijklmnopqrstuvwxyz"
        // ===========================================================================

        const DEFAULT_NAMES = `屁屁\nKiya\nKS\nming\n伯\nLIZ\nKK\n安娜\nLEO\nF\n小绿\n圈圈\n涵\n小燕子\nAmanda\n宝宝\n依依\n小莫\n豪\nRyan`;
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let currentCloudData = { list: DEFAULT_NAMES, title: '幸运大抽奖', history: [], lastDrawnSlot: "" };

        // 从云端加载完整数据
        async function loadFromCloud() {
            const statusDiv = document.getElementById('syncStatus');
            try {
                const response = await fetch(`${API_URL}/latest`, {
                    method: 'GET',
                    headers: { 
                        'X-Master-Key': MASTER_KEY,
                        'X-Bin-Meta': 'false'
                    }
                });
                const data = await response.json();
                
                if (data) {
                    currentCloudData = {
                        list: data.list || DEFAULT_NAMES,
                        title: data.title || '幸运大抽奖',
                        history: data.history || [],
                        lastDrawnSlot: data.lastDrawnSlot || ""
                    };
                }

                document.getElementById('customList').value = currentCloudData.list;
                document.getElementById('lotteryTitle').value = currentCloudData.title;
                renderCheckboxes(currentCloudData.list);
                renderHistory(currentCloudData.history);

                statusDiv.innerText = "✅ 云端数据加载完成";
                statusDiv.style.color = "#28a745";
            } catch (error) {
                console.error(error);
                document.getElementById('customList').value = DEFAULT_NAMES;
                renderCheckboxes(DEFAULT_NAMES);
                statusDiv.innerText = "⚠️ 离线模式（已自动加载默认名单）";
                statusDiv.style.color = "#ffc107";
            }
        }

        // 保存更新到云端
        async function updateCloudData(newData) {
            currentCloudData = { ...currentCloudData, ...newData };
            const statusDiv = document.getElementById('syncStatus');
            statusDiv.innerText = "正在同步到云端...";
            statusDiv.style.color = "#007bff";

            try {
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(currentCloudData)
                });

                if (response.ok) {
                    statusDiv.innerText = "✅ 数据已云端同步";
                    statusDiv.style.color = "#28a745";
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "❌ 云端同步失败";
                statusDiv.style.color = "#dc3545";
            }
        }

        // 手动保存名单和主题
        async function saveToCloud() {
            const rawText = document.getElementById('customList').value.trim();
            const titleText = document.getElementById('lotteryTitle').value.trim() || '幸运大抽奖';

            if (!rawText) {
                alert('请先输入名单！');
                return;
            }

            renderCheckboxes(rawText);
            await updateCloudData({ list: rawText, title: titleText });
            alert('名单与主题已成功同步至所有设备！');
        }

        // 渲染勾选框列表（一排5列）
        function renderCheckboxes(rawText) {
            const members = rawText.split('\n').map(name => name.trim()).filter(name => name !== '');
            const container = document.getElementById('personContainer');
            container.innerHTML = '';

            if (members.length === 0) {
                container.innerHTML = '<span style="color:#888; grid-column: span 5;">没有有效的名单输入</span>';
                return;
            }

            members.forEach(name => {
                const itemDiv = document.createElement('label');
                itemDiv.className = 'person-item';
                itemDiv.innerHTML = `<input type="checkbox" class="member-checkbox" value="${name}" checked> ${name}`;
                container.appendChild(itemDiv);
            });
        }

        // 全选 / 全不选
        function selectAll(status) {
            const checkboxes = document.querySelectorAll('.member-checkbox');
            checkboxes.forEach(cb => cb.checked = status);
        }

        // 基于标准 UTC 时间计算 10 分钟整点窗口 ID (如: "2026-08-13-13-2" 代表统一时间片)
        function getCurrentUtcSlotId() {
            const now = new Date();
            const utcYear = now.getUTCFullYear();
            const utcMonth = now.getUTCMonth() + 1;
            const utcDate = now.getUTCDate();
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();
            const slotIndex = Math.floor(utcMinutes / 10);
            return `${utcYear}-${utcMonth}-${utcDate}-${utcHours}-${slotIndex}`;
        }

        // 基于标准 UTC 时间计算统一倒计时秒数
        function getUtcSecondsUntilNextSlot() {
            const now = new Date();
            const utcMinutes = now.getUTCMinutes();
            const utcSeconds = now.getUTCSeconds();
            const nextSlotMinute = (Math.floor(utcMinutes / 10) + 1) * 10;
            return (nextSlotMinute - utcMinutes) * 60 - utcSeconds;
        }

        // 检查状态并更新倒计时（全网统一）
        function checkStatus() {
            const currentSlot = getCurrentUtcSlotId();
            const lastDrawnSlot = currentCloudData.lastDrawnSlot || localStorage.getItem('lastDrawnSlot');
            const btn = document.getElementById('drawBtn');
            const timerDiv = document.getElementById('timer');

            if (lastDrawnSlot === currentSlot) {
                btn.disabled = true;
                const remainingSeconds = getUtcSecondsUntilNextSlot();
                const m = Math.floor(remainingSeconds / 60);
                const s = remainingSeconds % 60;
                timerDiv.innerHTML = `⚠️ 本 10 分钟段已抽奖，下次开放还剩：${m} 分 ${s < 10 ? '0' : ''}${s} 秒`;
            } else {
                btn.disabled = false;
                timerDiv.innerHTML = "✅ 当前 10 分钟时间段开放中，可以抽奖";
            }
        }

        // 渲染 24 小时历史记录（包括参抽名单与中奖名单）
        function renderHistory(historyArr) {
            const historyListDiv = document.getElementById('historyList');
            const nowTimestamp = Date.now();
            const twentyFourHoursMs = 24 * 60 * 60 * 1000;

            const filteredHistory = (historyArr || []).filter(item => (nowTimestamp - item.timestamp) < twentyFourHoursMs);

            if (filteredHistory.length === 0) {
                historyListDiv.innerHTML = '<span style="color:#888; font-size: 13px;">暂无 24 小时内的抽奖记录</span>';
                return;
            }

            historyListDiv.innerHTML = filteredHistory.map(item => `
                <div class="history-item">
                    <div class="history-time">⏱️ 抽奖时间：${item.timeStr} | 🎯 主题：<b>${item.title || '幸运大抽奖'}</b></div>
                    <div class="history-detail">👥 参抽名单（共 ${item.participants ? item.participants.length : 0} 人）：<span style="color:#555;">${item.participants ? item.participants.join('、') : '未知'}</span></div>
                    <div class="history-detail">🎉 中奖名单：<strong style="color:#28a745;">${item.winners.join('、')}</strong></div>
                </div>
            `).join('');
        }

        // 核心抽奖逻辑
        async function drawWinners() {
            const checkboxes = document.querySelectorAll('.member-checkbox:checked');
            let participants = Array.from(checkboxes).map(cb => cb.value);

            const title = document.getElementById('lotteryTitle').value.trim() || '幸运大抽奖';
            const count = parseInt(document.getElementById('winnerCount').value, 10);
            const resultDiv = document.getElementById('result');

            if (participants.length === 0) {
                alert('请至少勾选一位参抽人员！');
                return;
            }

            if (isNaN(count) || count < 1 || count > participants.length) {
                alert('请输入有效的中奖名额！');
                return;
            }

            // 洗牌算法
            for (let i = participants.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [participants[i], participants[j]] = [participants[j], participants[i]];
            }

            const winners = participants.slice(0, count);

            // 显示本轮结果
            resultDiv.innerHTML = `<strong>🎉 【${title}】 中奖名单（共 ${count} 人）：</strong><br><br>` + 
                winners.map((w, index) => `<b>第 ${index + 1} 名：</b> ${w}`).join('<br>');

            // 追加到历史记录与云端抽奖锁槽位
            const nowTimestamp = Date.now();
            const timeString = new Date().toLocaleString('zh-CN', { hour12: false });
            const currentSlot = getCurrentUtcSlotId();
            
            const newRecord = {
                timestamp: nowTimestamp,
                timeStr: timeString,
                title: title,
                participants: Array.from(checkboxes).map(cb => cb.value),
                winners: winners
            };

            const twentyFourHoursMs = 24 * 60 * 60 * 1000;
            const updatedHistory = [newRecord, ...(currentCloudData.history || [])].filter(item => (nowTimestamp - item.timestamp) < twentyFourHoursMs);

            renderHistory(updatedHistory);
            
            // 本地与云端同时锁定该时间段
            localStorage.setItem('lastDrawnSlot', currentSlot);
            await updateCloudData({ history: updatedHistory, lastDrawnSlot: currentSlot });

            checkStatus();
        }

        // 启动运行
        loadFromCloud();
        setInterval(checkStatus, 1000);
        checkStatus();
    </script>

</body>
</html>
